<!DOCTYPE html>
<!--
  AOI map used by frontend/widgets/aoi_map_widget.py.
  Python <-> JS talk through QWebChannel ("bridge" object).
  Needs an internet connection for Leaflet and the map tiles (SRS constraint C-01).
-->
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css">
  <style>
    html, body, #map { height: 100%; margin: 0; }
    .hint { background: rgba(255,255,255,0.9); padding: 4px 8px; border-radius: 4px; font: 12px sans-serif; }
    .overlay-box { background: rgba(255,255,255,0.95); padding: 8px 10px; border-radius: 6px;
                   font: 12px sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,0.3); max-width: 230px; }
    .overlay-box .overlay-title { font-weight: 600; margin-bottom: 6px; word-break: break-all; }
    .overlay-box label { display: block; margin-bottom: 6px; }
    .overlay-box input { width: 100%; }
    .overlay-box button { font: 12px sans-serif; cursor: pointer; }
  </style>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
  <!-- qwebchannel.js is injected by AoiMapWidget (qrc: URLs are blocked once remote access is enabled) -->
</head>
<body>
<div id="map"></div>
<script>
  var esri = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
  var streets = L.tileLayer(esri + 'World_Street_Map/MapServer/tile/{z}/{y}/{x}',
      { maxZoom: 19, attribution: 'Tiles &copy; Esri' });
  var imagery = L.tileLayer(esri + 'World_Imagery/MapServer/tile/{z}/{y}/{x}',
      { maxZoom: 19, attribution: 'Tiles &copy; Esri' });
  var labels = L.tileLayer(esri + 'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
      { maxZoom: 19 });

  var map = L.map('map', { worldCopyJump: true }).setView([30.4, 69.3], 5);
  // Drop the "Leaflet" link from the credits (an accidental click left the map page).
  // The Esri tile credit stays: it is required by Esri's terms and is plain text.
  map.attributionControl.setPrefix(false);
  streets.addTo(map);
  L.control.layers(
      { 'Streets': streets, 'Satellite': imagery },
      { 'Place labels': labels }
  ).addTo(map);
  L.control.scale().addTo(map);

  // Layers: user-drawn shape (draw mode) and imported GeoJSON outline (file mode)
  var drawn = new L.FeatureGroup().addTo(map);
  var footprint = L.geoJSON(null, { style: { color: '#e67e22', weight: 2, fillOpacity: 0.15 } }).addTo(map);
  var shapeStyle = { color: '#2E9E78', weight: 2, fillOpacity: 0.15 };

  var drawControl = new L.Control.Draw({
    draw: {
      rectangle: { shapeOptions: shapeStyle },
      circle: { shapeOptions: shapeStyle, showRadius: true, metric: true },
      polygon: {
        shapeOptions: shapeStyle,
        allowIntersection: false,   // GEE rejects self-intersecting AOIs
        showArea: true,
        metric: true,
        drawError: { color: '#C0392B', message: 'Polygon edges cannot cross.' }
      },
      polyline: false, marker: false, circlemarker: false
    },
    edit: { featureGroup: drawn }
  });

  var hint = L.control({ position: 'bottomleft' });
  hint.onAdd = function () {
    var div = L.DomUtil.create('div', 'hint');
    div.innerHTML = 'Draw a rectangle, circle or polygon with the tools (top-left).';
    return div;
  };

  var bridge = null;
  new QWebChannel(qt.webChannelTransport, function (channel) {
    bridge = channel.objects.bridge;
    bridge.mapReady();
  });

  // Rectangle extends Polygon, so it must be tested first.
  function emitShape(layer) {
    if (!bridge) return;
    if (layer instanceof L.Circle) {
      var c = layer.getLatLng();
      bridge.circleDrawn(c.lng, c.lat, layer.getRadius());
    } else if (layer instanceof L.Rectangle) {
      var b = layer.getBounds();
      bridge.bboxDrawn(b.getWest(), b.getSouth(), b.getEast(), b.getNorth());
    } else if (layer instanceof L.Polygon) {
      bridge.polygonDrawn(JSON.stringify(layer.toGeoJSON().geometry));
    }
  }

  map.on(L.Draw.Event.CREATED, function (e) {
    drawn.clearLayers();          // one AOI at a time
    drawn.addLayer(e.layer);
    emitShape(e.layer);
  });
  map.on(L.Draw.Event.EDITED, function (e) { e.layers.eachLayer(emitShape); });
  map.on(L.Draw.Event.DELETED, function () { if (bridge) bridge.bboxCleared(); });

  // ---- called from Python ----
  var mode = null;
  function setMode(newMode) {
    if (newMode === mode) return;
    mode = newMode;
    if (mode === 'draw') {
      map.addControl(drawControl);
      hint.addTo(map);
      map.removeLayer(footprint);
      map.addLayer(drawn);
    } else {
      map.removeControl(drawControl);
      hint.remove();
      map.removeLayer(drawn);
      map.addLayer(footprint);
    }
  }

  function setBbox(west, south, east, north, fit) {
    drawn.clearLayers();
    var rect = L.rectangle([[south, west], [north, east]], shapeStyle);
    drawn.addLayer(rect);
    if (fit) map.fitBounds(rect.getBounds(), { maxZoom: 14 });
  }

  // A place's exact boundary (Polygon / MultiPolygon). Each polygon joins the drawn
  // group on its own, so the edit / delete tools work on it like a drawn shape.
  function setShape(text, fit) {
    drawn.clearLayers();
    L.geoJSON(JSON.parse(text), { style: function () { return shapeStyle; } })
      .eachLayer(function (layer) { drawn.addLayer(layer); });
    if (fit && drawn.getLayers().length) map.fitBounds(drawn.getBounds(), { maxZoom: 14 });
  }

  function clearShape() { drawn.clearLayers(); }

  // ---- a downloaded GeoTIFF laid over the map, with an opacity slider ----
  var image = null;
  var imageBox = L.control({ position: 'topright' });
  imageBox.onAdd = function () {
    var div = L.DomUtil.create('div', 'overlay-box');
    div.innerHTML = '<div class="overlay-title"></div>' +
        '<label>Opacity <input type="range" min="0" max="100"></label>' +
        '<button type="button">Remove from map</button>';
    L.DomEvent.disableClickPropagation(div);
    L.DomEvent.disableScrollPropagation(div);
    div.querySelector('input').oninput = function (e) { if (image) image.setOpacity(e.target.value / 100); };
    div.querySelector('button').onclick = clearImage;
    return div;
  };

  function showImage(url, west, south, east, north, title, opacity) {
    clearImage();
    image = L.imageOverlay(url, [[south, west], [north, east]], { opacity: opacity }).addTo(map);
    imageBox.addTo(map);
    var box = imageBox.getContainer();
    box.querySelector('.overlay-title').textContent = title;
    box.querySelector('input').value = Math.round(opacity * 100);
    map.fitBounds(image.getBounds());
  }

  function clearImage() {
    if (image) { map.removeLayer(image); image = null; }
    imageBox.remove();
  }

  function showGeoJSON(text) {
    footprint.clearLayers();
    if (!text) return;
    footprint.addData(JSON.parse(text));
    map.fitBounds(footprint.getBounds(), { maxZoom: 14 });
  }
</script>
</body>
</html>
